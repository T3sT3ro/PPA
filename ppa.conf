# Settings for this APT repository, read by the deploy workflow and ./ppa.sh.
# Leave a value empty to use its default. Bash syntax: quote values that contain spaces.

# Public URL of the repository.
# Default: this repository's GitHub Pages URL, including a custom domain, over https.
PPA_URL=

# Short name for the files users install:
# /etc/apt/keyrings/NAME.asc and /etc/apt/sources.list.d/NAME.sources.
# Default: the repository owner in lowercase.
PPA_NAME=

# Title of the landing page. Default: "<owner>'s PPA".
PPA_TITLE=
