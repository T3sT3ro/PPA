name: Build and Deploy PPA

on:
  push:
    branches: [ "main" ]
    paths:
      - 'pool/**'
      - 'README.md'
      - 'template.html'
      - 'ppa.conf'
      - 'scripts/build-site.sh'
      - 'scripts/config.sh'
      - '.github/workflows/deploy-ppa.yml'
  # Also started by sync-releases.yml and ./ppa.sh.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.build.outputs.url }}
      name: ${{ steps.build.outputs.name }}
      inrelease-sha256: ${{ steps.build.outputs.inrelease-sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install APT tools & pandoc
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg pandoc

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret PPA_GPG_PRIVATE_KEY is not set. Run ./ppa.sh setup (see TEMPLATE.md)."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build site
        id: build
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/build-site.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Installs the repository exactly as README.md tells users to.
  test-ppa:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    container: ubuntu:rolling
    env:
      URL: ${{ needs.build-and-deploy.outputs.url }}
      NAME: ${{ needs.build-and-deploy.outputs.name }}
      EXPECTED_INRELEASE: ${{ needs.build-and-deploy.outputs.inrelease-sha256 }}
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y curl ca-certificates

      - name: Wait until the new build is served
        run: |
          for i in $(seq 1 60); do
            served=$(curl -fsSL "$URL/InRelease" | sha256sum | cut -d' ' -f1)
            if [ "$served" = "$EXPECTED_INRELEASE" ]; then exit 0; fi
            echo "Not live yet ($i/60)"
            sleep 10
          done
          echo "::error::$URL/InRelease does not match this build after 10 minutes."
          exit 1

      - name: Add PPA
        run: |
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL "$URL/KEY.gpg" -o "/etc/apt/keyrings/$NAME.asc"
          curl -fsSL "$URL/$NAME.sources" -o "/etc/apt/sources.list.d/$NAME.sources"

      - name: Test APT Update
        run: |
          apt-get update
          apt-cache policy | grep -F "$URL"
