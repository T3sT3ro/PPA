name: Sync Releases

# Copies .deb assets from the GitHub releases of the repositories listed in
# upstreams.txt into pool/, commits them and starts a deploy.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [ "main" ]
    paths: [ 'upstreams.txt' ]
  # Sent by a source repository's release job (./ppa.sh connect --notify).
  repository_dispatch:
    types: [ new-release ]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Only sync this OWNER/REPO (must be listed in upstreams.txt)'
        required: false
      tag:
        description: 'With repo: sync this release tag instead of the latest'
        required: false

permissions:
  contents: write   # commit to pool/
  actions: write    # start deploy-ppa.yml

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download release assets
        env:
          # PPA_SYNC_TOKEN is only needed for private source repositories.
          GH_TOKEN: ${{ secrets.PPA_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          ONLY_REPO: ${{ inputs.repo || github.event.client_payload.repo }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: scripts/sync-releases.sh

      # A push made with GITHUB_TOKEN does not trigger other workflows,
      # so the deploy is started explicitly.
      - name: Commit, push and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add pool/
          if git diff --cached --quiet; then
            echo "No new packages."
            exit 0
          fi
          files=$(git diff --cached --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pool): sync $(wc -l <<<"$files") package file(s) from releases" -m "$files"
          git pull --rebase
          git push
          gh workflow run deploy-ppa.yml --ref "$GITHUB_REF_NAME"
